<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chuyển văn bản thành giọng nói</h1>
        </div>

        <div class="main-content">
            <div class="form-section">
                <div class="input-group">
                    <label>Văn bản</label>
                    <textarea
                        id="textInput"
                        placeholder="Nhập văn bản cần chuyển đổi..."
                        rows="10"
                    ></textarea>
                    <div class="char-count"><span id="charCount">0</span> ký tự</div>
                </div>

                <div class="control-group">
                    <div class="input-group small">
                        <label>Ngôn ngữ</label>
                        <select id="languageSelect">
                            <option value="vi" selected>Tiếng Việt</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="zh-CN">中文</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                        </select>
                    </div>

                    <div class="input-group small">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="slowSpeed">
                            <span>Tốc độ chậm</span>
                        </label>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="convertBtn" class="btn btn-primary">
                        <span class="btn-text">Chuyển đổi</span>
                        <span class="loader"></span>
                    </button>
                    <button id="clearBtn" class="btn btn-secondary">Xóa</button>
                </div>
            </div>

            <div id="resultSection" class="result-section">
                <div class="result-header">Kết quả</div>
                <div class="audio-wrapper">
                    <audio id="audioPlayer" controls></audio>
                </div>
                <button id="downloadBtn" class="btn btn-download">Tải xuống MP3</button>
            </div>

            <div id="errorSection" class="error-message">
                <span id="errorMessage"></span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
